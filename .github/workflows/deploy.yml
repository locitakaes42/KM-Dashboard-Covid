name: Deploy Vue.js App to VPS

on:
  push:
    branches:
      - main # Sesuaikan dengan branch deployment Anda

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build Vue.js application
      run: npm run build

    # -- TAMBAHKAN LANGKAH INI --
    - name: Prepare deployment directory on VPS
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Membuat direktori target jika belum ada dan mengatur izinnya
          sudo mkdir -p ${{ secrets.DEPLOY_TARGET_PATH }}
          # Mengubah kepemilikan direktori ke user SSH yang digunakan untuk deployment
          sudo chown -R ${{ secrets.SSH_USERNAME }}:${{ secrets.SSH_USERNAME }} ${{ secrets.DEPLOY_TARGET_PATH }}
          # Mengatur izin agar pemilik bisa baca/tulis/eksekusi, grup dan lainnya hanya baca/eksekusi
          sudo chmod -R 755 ${{ secrets.DEPLOY_TARGET_PATH }}
          echo "Deployment target directory prepared: ${{ secrets.DEPLOY_TARGET_PATH }}"
    # -- AKHIR DARI LANGKAH TAMBAHAN --

    - name: Deploy via SSH # Ini adalah langkah scp-action yang sebelumnya error
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "dist/"
        target: ${{ secrets.DEPLOY_TARGET_PATH }}

    - name: Run post-deployment commands
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ${{ secrets.DEPLOY_TARGET_PATH }}
          # Opsional: Jika Anda ingin menghapus folder dist lama sebelum menimpa
          # rm -rf dist-old # Hapus dist lama setelah yang baru siap
          # mv dist dist-old # Backup yang lama sebelum disalin yang baru
          # Atau jika Anda menyalin langsung ke folder yang sama, scp akan menimpa

          sudo systemctl restart nginx
          echo "Deployment successful and Nginx restarted!"